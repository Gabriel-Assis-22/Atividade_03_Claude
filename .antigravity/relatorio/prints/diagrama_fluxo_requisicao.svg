<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="seq-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="940" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="28" font-size="13.5" font-weight="bold" fill="#0f172a">Fluxo de uma Requisição de Negócio — Passageiro Reserva Assento (POST /api/caronas/{id}/reservar)</text>

  <!-- Lifelines Headers -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="25" y="45" width="120" height="38" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="85" y="68" fill="#1e3a8a">Navegador SPA</text>

    <rect x="180" y="45" width="125" height="38" rx="5" fill="#fef3c7" stroke="#b96f1f"/>
    <text x="242" y="68" fill="#78350f">Nginx (:8208)</text>

    <rect x="340" y="45" width="150" height="38" rx="5" fill="#ffffff" stroke="#0f172a"/>
    <text x="415" y="68" fill="#0f172a">backend (:8080)</text>

    <rect x="525" y="45" width="140" height="38" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="595" y="68" fill="#1d4ed8">auth-service / JWT</text>

    <rect x="700" y="45" width="105" height="38" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="752" y="68" fill="#0369a1">MariaDB</text>

    <rect x="825" y="45" width="95" height="38" rx="5" fill="#ecfdf5" stroke="#059669"/>
    <text x="872" y="68" fill="#065f46">log-service</text>
  </g>

  <!-- Vertical Lifelines -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="85" y1="83" x2="85" y2="405"/>
    <line x1="242" y1="83" x2="242" y2="405"/>
    <line x1="415" y1="83" x2="415" y2="405"/>
    <line x1="595" y1="83" x2="595" y2="405"/>
    <line x1="752" y1="83" x2="752" y2="405"/>
    <line x1="872" y1="83" x2="872" y2="405"/>
  </g>

  <!-- Step 1: Login prior / JWT -->
  <line x1="85" y1="112" x2="593" y2="112" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#seq-arr)"/>
  <text x="335" y="106" text-anchor="middle" font-size="9.5" fill="#1d4ed8">1. Sessão prévia: Login em /api/auth/login emite JWT assinado (userId, email, role=passageiro)</text>

  <!-- Step 2: POST reservar -->
  <line x1="85" y1="145" x2="240" y2="145" stroke="#1e293b" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="162" y="139" text-anchor="middle" font-size="9.5" fill="#0f172a">2. POST /api/caronas/1/reservar</text>

  <!-- Step 3: Proxy pass -->
  <line x1="242" y1="170" x2="413" y2="170" stroke="#1e293b" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="328" y="164" text-anchor="middle" font-size="9.5" fill="#78350f">3. proxy_pass + Bearer JWT</text>

  <!-- Step 4: Local JWT validation -->
  <rect x="355" y="184" width="225" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="467" y="200" text-anchor="middle" font-size="9.5" fill="#1e3a8a">4. JwtBearer valida JWT_SECRET e extrai userId</text>

  <!-- Step 5: Check carona, usuario & cota Free -->
  <line x1="415" y1="230" x2="750" y2="230" stroke="#1e293b" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="582" y="224" text-anchor="middle" font-size="9.5" fill="#0369a1">5. SELECT carona, is_premium (usuarios) e COUNT reservas ativas</text>

  <!-- Step 6: Conditional note -->
  <rect x="430" y="244" width="305" height="26" rx="4" fill="#fff7ed" stroke="#fdba74"/>
  <text x="582" y="261" text-anchor="middle" font-size="9" fill="#9a3412">Se is_premium=0 e reservas_ativas &gt;= 2 → 403 LIMITE_PLANO_FREE</text>

  <!-- Step 7: Atomic decrement + insert -->
  <line x1="415" y1="292" x2="750" y2="292" stroke="#1e293b" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="582" y="286" text-anchor="middle" font-size="9.5" fill="#0f172a">6. UPDATE vagas_disponiveis - 1 (atômico) + INSERT INTO reservas</text>

  <!-- Step 8: Audit log -->
  <line x1="415" y1="330" x2="870" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#seq-ret)"/>
  <text x="642" y="324" text-anchor="middle" font-size="9.5" fill="#065f46">7. POST /logs (acao="reserva_solicitada") → XADD audit_stream no Redis</text>

  <!-- Step 9: Return 201 -->
  <line x1="415" y1="372" x2="87" y2="372" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#seq-ret)"/>
  <text x="250" y="365" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">8. HTTP 201 Created {"reservaId": 1, "mensagem": "Reserva confirmada!"}</text>
</svg>

