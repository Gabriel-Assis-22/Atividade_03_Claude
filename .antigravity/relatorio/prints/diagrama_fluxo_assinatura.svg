<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="s-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b96f1f"/>
    </marker>
    <marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="940" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="28" font-size="13.5" font-weight="bold" fill="#0f172a">Ciclo de Vida da Assinatura UniRide Pro (R$ 14,90/mês) — Checkout, Webhook Assinado e Customer Portal</text>

  <!-- Row 1: Checkout Flow -->
  <rect x="24" y="48" width="195" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="121" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">1. Clique em "Assinar Pro"</text>
  <text x="121" y="86" text-anchor="middle" font-size="9.5" fill="#334155">Frontend chama</text>
  <text x="121" y="101" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">POST /api/assinaturas/checkout</text>
  <text x="121" y="117" text-anchor="middle" font-size="9" fill="#475569">Com JWT do usuário autenticado</text>

  <line x1="219" y1="93" x2="262" y2="93" stroke="#334155" stroke-width="1.6" marker-end="url(#s-arr)"/>

  <rect x="264" y="48" width="225" height="90" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
  <text x="376" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">2. Criação da Sessão (Backend)</text>
  <text x="376" y="86" text-anchor="middle" font-size="9.5" fill="#334155">SessionService.CreateAsync</text>
  <text x="376" y="101" text-anchor="middle" font-size="9.5" fill="#b96f1f">Mode = "subscription" · R$ 14,90/mês</text>
  <text x="376" y="117" text-anchor="middle" font-size="9" fill="#475569">ClientReferenceId + Metadata.usuarioId</text>

  <line x1="489" y1="93" x2="532" y2="93" stroke="#b96f1f" stroke-width="1.6" marker-end="url(#s-orange)"/>

  <rect x="534" y="48" width="205" height="90" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/>
  <text x="636" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">3. Stripe Hosted Checkout</text>
  <text x="636" y="86" text-anchor="middle" font-size="9.5" fill="#7c2d12">Pagamento em Modo Teste</text>
  <text x="636" y="101" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">Cartão 4242 4242 4242 4242</text>
  <text x="636" y="117" text-anchor="middle" font-size="9" fill="#7c2d12">Conformidade PCI-DSS no Stripe</text>

  <!-- Arrow down to Webhook -->
  <path d="M 739 93 L 840 93 L 840 172" stroke="#b96f1f" stroke-width="1.7" stroke-dasharray="5 3" fill="none" marker-end="url(#s-orange)"/>
  <text x="840" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#9a3412">Evento Assíncrono</text>

  <!-- Row 2: Webhook Validation & Idempotent DB Update -->
  <rect x="650" y="175" width="266" height="108" rx="6" fill="#fef3c7" stroke="#b96f1f" stroke-width="1.5"/>
  <text x="783" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">4. Validação de Webhook</text>
  <text x="783" y="213" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400e">POST /api/webhooks/stripe</text>
  <text x="783" y="229" text-anchor="middle" font-size="9.2" fill="#334155">EventUtility.ConstructEvent()</text>
  <text x="783" y="245" text-anchor="middle" font-size="9" fill="#475569">Verifica HMAC em Stripe-Signature</text>
  <text x="783" y="261" text-anchor="middle" font-size="9" fill="#991b1b">Sem assinatura válida → HTTP 400</text>

  <line x1="650" y1="229" x2="598" y2="229" stroke="#334155" stroke-width="1.6" marker-end="url(#s-arr)"/>

  <rect x="310" y="175" width="286" height="108" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="453" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">5. Atualização Idempotente no MariaDB</text>
  <text x="453" y="214" text-anchor="middle" font-size="9.2" fill="#1e293b">• checkout.session.completed → is_premium = 1</text>
  <text x="453" y="230" text-anchor="middle" font-size="9.2" fill="#1e293b">• subscription.created/updated → status active</text>
  <text x="453" y="246" text-anchor="middle" font-size="9.2" fill="#1e293b">• subscription.deleted → is_premium = 0 (Free)</text>
  <text x="453" y="264" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369a1">Idempotente: reentrega aplica mesmo SET sem duplicar</text>

  <line x1="310" y1="229" x2="258" y2="229" stroke="#059669" stroke-width="1.6" marker-end="url(#s-green)"/>

  <rect x="24" y="175" width="232" height="108" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">6. Limite Liberado + Auditoria</text>
  <text x="140" y="215" text-anchor="middle" font-size="9.5" fill="#047857">ReservaUseCases lê is_premium = 1:</text>
  <text x="140" y="232" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">Reservas ilimitadas liberadas!</text>
  <text x="140" y="249" text-anchor="middle" font-size="9" fill="#334155">Grava stripe_customer_id no usuário</text>
  <text x="140" y="265" text-anchor="middle" font-size="9" fill="#047857">Evento webhook_stripe_sucesso (Redis)</text>

  <!-- Row 3: Cancellation via Customer Portal -->
  <rect x="24" y="318" width="892" height="96" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="44" y="340" font-size="11.5" font-weight="bold" fill="#3730a3">7. Autoatendimento e Cancelamento — Stripe Customer Portal (POST /api/assinaturas/portal)</text>
  <text x="44" y="360" font-size="9.8" fill="#334155">1) Assinante clica em "Portal do Cliente Stripe" no Painel → Backend chama BillingPortal.SessionService.CreateAsync(stripe_customer_id).</text>
  <text x="44" y="378" font-size="9.8" fill="#334155">2) Usuário gerencia cartão, faturas ou cancela assinatura no ambiente seguro do Stripe e retorna para /painel.</text>
  <text x="44" y="396" font-size="9.8" fill="#334155">3) Ao cancelar, o Stripe dispara customer.subscription.deleted → Webhook rebaixa is_premium = 0 e restaura o limite de 2 reservas.</text>
</svg>

