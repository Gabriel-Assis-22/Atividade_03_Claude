<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b96f1f"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Title bar -->
  <text x="24" y="30" font-size="14" font-weight="bold" fill="#0f172a">Arquitetura de Componentes e Microsserviços — UniRide SaaS</text>
  <text x="24" y="48" font-size="10.5" fill="#64748b">Fronteira pública (HTTPS / Domínio) vs. Rede isolada Docker (app-network) + Persistência e Provedores SaaS</text>

  <!-- ZONE 1: CLIENTE / EXTERNO -->
  <rect x="20" y="65" width="185" height="450" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3" stroke-width="1.2"/>
  <text x="32" y="86" font-size="11" font-weight="bold" fill="#334155">REDE EXTERNA / INTERNET</text>

  <!-- Browser -->
  <rect x="35" y="108" width="155" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="112" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Navegador (Cliente)</text>
  <text x="112" y="147" text-anchor="middle" font-size="10" fill="#334155">Angular 19 SPA</text>
  <text x="112" y="163" text-anchor="middle" font-size="9.5" fill="#475569">HTTPS · lapps.studio</text>

  <!-- Stripe SaaS -->
  <rect x="35" y="235" width="155" height="105" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/>
  <text x="112" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">Stripe (SaaS)</text>
  <text x="112" y="274" text-anchor="middle" font-size="10" fill="#7c2d12">Checkout (subscription)</text>
  <text x="112" y="290" text-anchor="middle" font-size="10" fill="#7c2d12">Customer Portal</text>
  <text x="112" y="306" text-anchor="middle" font-size="9.5" fill="#9a3412">Webhooks Assinados</text>
  <text x="112" y="322" text-anchor="middle" font-size="9" fill="#b45309">(Stripe-Signature)</text>

  <!-- Mailtrap & GitHub -->
  <rect x="35" y="378" width="155" height="115" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="112" y="400" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Serviços SaaS Auxiliares</text>
  <text x="112" y="420" text-anchor="middle" font-size="10" fill="#475569">• Mailtrap Email API</text>
  <text x="112" y="435" text-anchor="middle" font-size="9.5" fill="#64748b">(Reset de senha 30min)</text>
  <text x="112" y="458" text-anchor="middle" font-size="10" fill="#475569">• GitHub Cloud</text>
  <text x="112" y="473" text-anchor="middle" font-size="9.5" fill="#64748b">(Repositório Git e Issues)</text>

  <!-- ZONE 2: GATEWAY PUBLICO -->
  <rect x="235" y="65" width="175" height="275" rx="8" fill="#fef3c7" fill-opacity="0.35" stroke="#b96f1f" stroke-width="1.4"/>
  <text x="247" y="86" font-size="11" font-weight="bold" fill="#92400e">PORTA PÚBLICA (:8208)</text>

  <rect x="250" y="110" width="145" height="195" rx="6" fill="#ffffff" stroke="#b96f1f" stroke-width="1.6"/>
  <text x="322" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">frontend (Nginx)</text>
  <text x="322" y="151" text-anchor="middle" font-size="10" fill="#92400e">Container: :80 → Host :8208</text>
  <line x1="262" y1="162" x2="382" y2="162" stroke="#fde68a" stroke-width="1"/>
  <text x="262" y="180" font-size="9.5" fill="#334155">• Serve SPA Angular</text>
  <text x="262" y="198" font-size="9.5" fill="#334155">• Proxy /api/* → :8080</text>
  <text x="262" y="216" font-size="9.5" fill="#334155">• Proxy /swagger/* → :8080</text>
  <text x="262" y="234" font-size="9.5" fill="#334155">• Proxy /storage/* → foto</text>
  <text x="262" y="256" font-size="9" font-weight="bold" fill="#b96f1f">Único ponto exposto!</text>

  <!-- ZONE 3: REDE INTERNA DOCKER -->
  <rect x="440" y="65" width="320" height="450" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="454" y="86" font-size="11" font-weight="bold" fill="#1e293b">REDE INTERNA DOCKER (app-network)</text>
  <text x="454" y="101" font-size="9.5" fill="#64748b">Sem mapeamento ports: no host (apenas expose)</text>

  <!-- backend -->
  <rect x="460" y="116" width="280" height="108" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <text x="600" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">backend — UniRide API (.NET 10 DDD)</text>
  <text x="600" y="153" text-anchor="middle" font-size="10" fill="#475569">expose :8080 · Caronas, Veículos, Reservas</text>
  <text x="600" y="169" text-anchor="middle" font-size="9.5" fill="#334155">RBAC JWT · Anti-IDOR · Cota Free (máx. 2 reservas)</text>
  <text x="600" y="185" text-anchor="middle" font-size="9.5" fill="#334155">Stripe Checkout / Portal / Webhook / Métricas MRR</text>
  <text x="600" y="201" text-anchor="middle" font-size="9.5" fill="#334155">FluentMigrator · Swagger OpenAPI 3.0</text>

  <!-- auth-service -->
  <rect x="460" y="250" width="280" height="82" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="600" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">auth-service (.NET 10 DDD)</text>
  <text x="600" y="287" text-anchor="middle" font-size="10" fill="#475569">expose :8081 · Login, Registro, BCrypt, JWT</text>
  <text x="600" y="303" text-anchor="middle" font-size="9.5" fill="#334155">3 Papéis RBAC: passageiro · motorista · admin</text>
  <text x="600" y="318" text-anchor="middle" font-size="9.5" fill="#334155">Tokens de recuperação de senha (TTL 30 min)</text>

  <!-- log-service -->
  <rect x="460" y="354" width="165" height="72" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="542" y="375" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">log-service (.NET 10)</text>
  <text x="542" y="391" text-anchor="middle" font-size="9.5" fill="#475569">expose :8082</text>
  <text x="542" y="407" text-anchor="middle" font-size="9.5" fill="#334155">POST /logs · GET /logs</text>

  <!-- redis -->
  <rect x="640" y="354" width="100" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="690" y="375" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">redis:7</text>
  <text x="690" y="391" text-anchor="middle" font-size="9.5" fill="#047857">expose :6379</text>
  <text x="690" y="407" text-anchor="middle" font-size="9" fill="#065f46">audit_stream</text>

  <!-- garage -->
  <rect x="460" y="444" width="280" height="56" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="600" y="465" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">garage + garage-init (Garage S3 v1.0.1)</text>
  <text x="600" y="483" text-anchor="middle" font-size="9.5" fill="#475569">expose :3900 (API S3 SigV4) · Bucket: profile-photos (veículos e perfis)</text>

  <!-- ZONE 4: BANCO RELACIONAL -->
  <rect x="785" y="65" width="155" height="275" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="862" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">BANCO DE DADOS</text>
  <text x="862" y="103" text-anchor="middle" font-size="9.5" fill="#64748b">Infraestrutura IaaS/PaaS</text>

  <rect x="800" y="120" width="125" height="198" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="862" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">MariaDB 10</text>
  <text x="862" y="159" text-anchor="middle" font-size="9.5" fill="#0369a1">Porta :3306 (Dapper)</text>
  <line x1="810" y1="169" x2="915" y2="169" stroke="#bae6fd" stroke-width="1"/>
  <text x="812" y="187" font-size="9.5" fill="#1e293b">• usuarios (plano)</text>
  <text x="812" y="204" font-size="9.5" fill="#1e293b">• veiculos</text>
  <text x="812" y="221" font-size="9.5" fill="#1e293b">• caronas</text>
  <text x="812" y="238" font-size="9.5" fill="#1e293b">• reservas</text>
  <text x="812" y="255" font-size="9.5" fill="#1e293b">• avaliacoes</text>
  <text x="812" y="272" font-size="9.5" fill="#1e293b">• reset_tokens</text>

  <!-- ARROWS -->
  <!-- Browser -> Nginx -->
  <line x1="190" y1="145" x2="248" y2="145" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="219" y="138" text-anchor="middle" font-size="8.5" fill="#1d4ed8">HTTPS</text>

  <!-- Stripe Webhook -> Nginx -->
  <path d="M 190 275 L 250 250" stroke="#b96f1f" stroke-width="1.6" stroke-dasharray="4 2" fill="none" marker-end="url(#arr-orange)"/>
  <text x="218" y="282" text-anchor="middle" font-size="8.5" fill="#9a3412">Webhook</text>

  <!-- Nginx -> Backend -->
  <line x1="395" y1="170" x2="458" y2="170" stroke="#b96f1f" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <text x="426" y="163" text-anchor="middle" font-size="8.5" fill="#92400e">/api/*</text>

  <!-- Backend -> Auth -->
  <line x1="560" y1="224" x2="560" y2="248" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="615" y="240" font-size="8.5" fill="#1d4ed8">HTTP :8081 (/auth)</text>

  <!-- Backend -> LogService -->
  <path d="M 495 224 L 495 352" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <!-- Auth -> LogService -->
  <line x1="542" y1="332" x2="542" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- LogService -> Redis -->
  <line x1="625" y1="390" x2="638" y2="390" stroke="#059669" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Backend -> Garage -->
  <path d="M 472 224 L 472 442" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 2" fill="none" marker-end="url(#arr)"/>

  <!-- Backend -> MariaDB -->
  <line x1="740" y1="170" x2="798" y2="170" stroke="#0284c7" stroke-width="1.7" marker-end="url(#arr)"/>
  <!-- Auth -> MariaDB -->
  <path d="M 740 285 L 772 285 L 772 230 L 798 230" stroke="#0284c7" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Backend -> Stripe API -->
  <path d="M 460 198 L 418 198 L 418 320 L 192 320" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arr-orange)"/>
  <text x="320" y="333" text-anchor="middle" font-size="8.5" fill="#9a3412">SDK Stripe.net (Checkout / Portal)</text>

  <!-- Auth -> Mailtrap -->
  <path d="M 460 312 L 430 312 L 430 415 L 192 415" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
</svg>

